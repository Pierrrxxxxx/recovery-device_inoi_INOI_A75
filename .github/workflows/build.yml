name: Build Multi-Recovery INOI A75

on:
  workflow_dispatch:
    inputs:
      recovery_type:
        description: "Select recovery to build"
        required: true
        default: "twrp"
        type: choice
        options:
          - twrp
          - pbrp
          - ofox

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Cleanup / Free disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential curl python3 openjdk-11-jdk ccache rsync zip

      - name: Setup 24GB swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1G count=24 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h .

      - name: Install repo tool
        run: |
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o repo
          chmod +x repo
          sudo mv repo /usr/local/bin/repo

      - name: Sync sources and build recovery
        shell: bash
        run: |
          set +e

          DEVICE_CODENAME="INOI_A75"
          RECOVERY="${{ github.event.inputs.recovery_type }}"
          WORKSPACE="$GITHUB_WORKSPACE/rec_src"
          DEVICE_DIR="device/inoi/${DEVICE_CODENAME}"

          mkdir -p "$WORKSPACE"

          if [[ "$RECOVERY" == "ofox" ]]; then
            git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$GITHUB_WORKSPACE/ofox_sync"

            cd "$GITHUB_WORKSPACE/ofox_sync"
            ./orangefox_sync.sh --branch 12.1 --path "$WORKSPACE"

            cd "$WORKSPACE"
          else
            cd "$WORKSPACE"

            case "$RECOVERY" in
              twrp)
                repo init --depth=1 \
                  -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
                  -b twrp-12.1
                ;;
              pbrp)
                repo init --depth=1 \
                  -u https://github.com/PitchBlackRecoveryProject/manifest_pb \
                  -b android-12.1
                ;;
            esac

            repo sync -c -j"$(nproc)" --force-sync --no-tags --no-clone-bundle
          fi

          mkdir -p "$DEVICE_DIR"

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            "$GITHUB_WORKSPACE/device_tree/" \
            "$DEVICE_DIR/"

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          case "$RECOVERY" in
            twrp)
              lunch twrp_${DEVICE_CODENAME}-eng
              mka vendorbootimage
              ;;
            pbrp)
              lunch pb_${DEVICE_CODENAME}-eng
              mka pbrp
              ;;
            ofox)
              lunch twrp_${DEVICE_CODENAME}-eng
              mka adbd vendorbootimage
              ;;
          esac

      - name: Package recovery zip
        shell: bash
        run: |
          set -e

          DEVICE_CODENAME="INOI_A75"
          RECOVERY="${{ github.event.inputs.recovery_type }}"
          OUT_DIR="$GITHUB_WORKSPACE/rec_src/out/target/product/${DEVICE_CODENAME}"

          mkdir -p artifacts

          ZIP_FILE="artifacts/${DEVICE_CODENAME}-${RECOVERY}.zip"

          if [[ "$RECOVERY" == "ofox" ]]; then
            shopt -s nullglob

            RECOVERY_IMG=""

            for img in "$OUT_DIR"/*.img; do
              if [[ "$(basename "$img")" != "vendor_boot.img" ]]; then
                RECOVERY_IMG="$img"
                break
              fi
            done

            shopt -u nullglob

            if [[ -z "$RECOVERY_IMG" ]]; then
              echo "OrangeFox recovery image not found"
              exit 1
            fi

            zip -j "$ZIP_FILE" "$RECOVERY_IMG"
          else
            if ! ls "$OUT_DIR"/*.img >/dev/null 2>&1; then
              echo "No images produced"
              exit 1
            fi

            zip -j "$ZIP_FILE" "$OUT_DIR"/*.img
          fi

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: INOI_A75-${{ github.event.inputs.recovery_type }}
          path: artifacts/*.zip
